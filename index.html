<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <script>
    // The public page moved to whgemachs.org — redirect direct visits (not the embedded iframe).
    if (location.hostname === "barry253.github.io" && window.top === window.self) {
      location.replace("https://whgemachs.org/g/wh-medical");
    }
  </script>
  <title>West Hempstead Medical Gemach</title>
  <!--
    Legacy embed (iframed on anshei.org). The request form used to live here; since Oct 2026 requests go
    through whgemachs.org (with spam protection), so this is just a card that opens the gemach's page.
    No scripts, no API calls. This is the GitHub Pages copy (barry253.github.io/wh-gemach): direct visits redirect, iframes show the card.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #1B3A4B; --cream: #FBF6EC; --gold: #E0A63A; --text: #1A2B35; --muted: #5A6B74; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); background: #ffffff; padding: 1rem; line-height: 1.5; }
    .card { max-width: 640px; margin: 0 auto; background: var(--cream); border-top: 3px solid var(--gold);
      border-radius: 10px; padding: 1.5rem 1.25rem; text-align: center; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.4rem; color: var(--navy); font-weight: 600; margin-bottom: 0.5rem; }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    a.btn { display: inline-block; background: var(--navy); color: #ffffff; text-decoration: none; font-weight: 600;
      padding: 0.8rem 1.4rem; border-radius: 8px; font-size: 1rem; }
    a.btn:hover, a.btn:focus-visible { background: #12303f; outline: 3px solid var(--gold); outline-offset: 2px; }
    .small { margin: 1rem 0 0; font-size: 0.85rem; }
    .small a { color: var(--navy); }
  </style>
</head>
<body>
  <main class="card">
    <h1>West Hempstead Medical Gemach</h1>
    <p>Wheelchairs, walkers, shower chairs and more, lent free to the community. See what's available and send a request online.</p>
    <a class="btn" href="https://whgemachs.org/g/wh-medical" target="_blank" rel="noopener">See items &amp; request →</a>
    <p class="small">Part of <a href="https://whgemachs.org/" target="_blank" rel="noopener">West Hempstead Gemachs</a></p>
  </main>
</body>
</html>
