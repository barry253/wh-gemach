# TEMPORARY (branch logo-png only): converts the gemach logos stored as WebP in R2 to PNG copies in
# site/assets/gemachs/<slug>/logo.png, for link previews (WhatsApp doesn't reliably show WebP). Removed before merging.
name: Logo PNG copies
on:
  push:
    branches: [logo-png]
    paths: [.github/workflows/logo-png.yml]
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: logo-png }
      - run: pip install pillow
      - name: Download and convert
        run: |
          python3 - <<'PY'
          import urllib.request, io, os
          from PIL import Image
          R2 = "https://pub-ccb909d9c0d644b5bf1f9f2b769e9365.r2.dev/"
          logos = {
            "adiras-costumes": "adiras-costumes/logo/1791929770854.webp",
            "simcha-dress": "simcha-dress/logo/1791925478716.webp",
            "fab-plus": "fab-plus/logo/1791925501961.webp",
            "from-stead-to-wed-dress-gemach": "from-stead-to-wed-dress-gemach/logo/1791223901028.webp",
            "goldenberg-medical": "goldenberg-medical/logo/1791925516980.webp",
            "chair-table-gemach": "chair-table-gemach/logo/1791925538616.webp",
            "sefer-shelf": "sefer-shelf/logo/1791920023214.webp",
            "shulchan-yehuda": "shulchan-yehuda/logo/1791925558701.webp",
            "centerpiece-gemach": "centerpiece-gemach/logo/1791925575261.webp",
            "wh-medical": "wh-medical/logo/1791925950922.webp",
          }
          for slug, key in logos.items():
            try:
              req = urllib.request.Request(R2 + key, headers={"User-Agent": "Mozilla/5.0 (whgemachs logo copy)"})
              data = urllib.request.urlopen(req, timeout=30).read()
            except Exception as e:
              print(f"::error title=download {slug}::{e}")
              raise
            im = Image.open(io.BytesIO(data))
            im.load()
            # Previews want an opaque image: flatten any transparency onto white (the logo tile is white on the site).
            if im.mode in ("RGBA", "LA", "P"):
              im = im.convert("RGBA")
              bg = Image.new("RGB", im.size, (255, 255, 255))
              bg.paste(im, mask=im.split()[3])
              im = bg
            else:
              im = im.convert("RGB")
            os.makedirs(f"site/assets/gemachs/{slug}", exist_ok=True)
            out = f"site/assets/gemachs/{slug}/logo.png"
            im.save(out, "PNG", optimize=True)
            print(slug, im.size, os.path.getsize(out))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add site/assets/gemachs
          git commit -m "PNG copies of the gemach logos (for link previews)"
          git push origin HEAD:logo-png
