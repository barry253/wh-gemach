name: D1 schema
# Run by hand (Actions → "D1 schema" → Run workflow) after changing worker/src/dbschema.js and running
# `npm run schema`: (re)applies worker/schema.sql to the live D1 database — new tables, views and indexes;
# existing data is kept. (CREATE TABLE IF NOT EXISTS never adds columns to an existing table: new columns
# need an ALTER TABLE on the live database.)
#
# The Airtable "copy" and "compare" tasks were removed on Oct 13, 2026: D1 has been the live database since
# Oct 7 and Airtable is no longer updated, so a copy would have replaced live data with an old snapshot.
# Needs repository secret CLOUDFLARE_API_TOKEN (D1 edit).
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options: [schema]
        default: schema

permissions:
  contents: read

concurrency:
  group: d1-migration
  cancel-in-progress: false

jobs:
  d1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      D1_DATABASE_ID: 974be829-ed62-4e9a-9965-77784d5d74a5
      CLOUDFLARE_ACCOUNT_ID: 30f51b1774b3c34eac1847d23240b759
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: scripts/step.sh "npm ci" npm ci
      - name: Check secrets are set
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
      - name: Apply schema
        if: inputs.task == 'schema'
        run: scripts/step.sh "Apply schema" npx wrangler d1 execute wh-gemach --remote --file=schema.sql --yes
