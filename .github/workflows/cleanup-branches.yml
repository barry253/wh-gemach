name: Clean up merged branches
# Deletes branches whose work is already in main, so old branches don't pile up.
# Never touches main or any branch with commits that aren't in main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete branches already merged into main
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          main_tip=$(git rev-parse origin/main)
          now=$(date +%s)
          for b in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            case "$b" in main|HEAD) continue ;; esac
            ref="origin/$b"
            tip=$(git rev-parse "$ref")
            # Not merged: has work that isn't in main -> keep.
            git merge-base --is-ancestor "$tip" "$main_tip" || { echo "keep $b (not merged)"; continue; }
            # Same commit as main: probably a branch someone just started -> keep for now.
            [ "$tip" = "$main_tip" ] && { echo "keep $b (no new commits yet)"; continue; }
            # Last commit under an hour old: may still be in use -> keep for now.
            age=$(( now - $(git log -1 --format=%ct "$tip") ))
            [ "$age" -lt 3600 ] && { echo "keep $b (active in the last hour)"; continue; }
            echo "delete $b (merged into main)"
            git push origin --delete "$b"
          done
