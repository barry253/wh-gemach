name: Sefer Shelf covers
# One-off helper on the temporary sefer-covers branch: looks up book covers and publish years
# (the Claude workspace can't reach book sites) and commits them back to this branch for review.
on:
  push:
    branches: [sefer-covers]
    paths: [tools/sefer-covers/books.json, tools/sefer-covers/fetch.py, .github/workflows/sefer-covers.yml]
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sefer-covers/fetch.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sefer-covers/raw tools/sefer-covers/meta.json
          git commit -m "Sefer Shelf covers: lookup results" || exit 0
          git push
