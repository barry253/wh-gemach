name: Live check
# After every deploy (push to main) and once a day: open the REAL whgemachs.org like a borrower and check the
# pages load without script errors and the request form opens (tests/live/live-check.cjs). It never sends a
# request. A failed run makes GitHub email the repo owner (Actions notifications).
# On a push to main it first waits until Cloudflare serves this commit (whgemachs.org/version.txt shows it, and
# the page points at this build's gemach.js fingerprint) and the worker's "Workers Builds" check for main has
# finished, so it tests what just shipped. Commits usually reach main by fast-forward from a branch that already
# has a (failed) branch build on the same commit; that result is older than the push and is ignored.
on:
  push:
    branches: [main]
    paths: ["site/**", "admin.html", "embed.html", "build.sh", "functions/**", "worker/src/**", "worker/wrangler.toml", "tests/live/**", ".github/workflows/live-check.yml"]
  schedule:
    - cron: "41 11 * * *"   # daily, ~7:41 am New York
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  live:
    name: Live site check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for this commit to be live
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          sh build.sh >/dev/null
          want=$(grep -o 'gemach\.js?v=[A-Za-z0-9]*' dist/gemach.html | cut -d= -f2)
          echo "EXPECT_GEMACH_JS=$want" >> "$GITHUB_ENV"
          echo "Waiting for whgemachs.org to serve commit $GITHUB_SHA (gemach.js?v=$want)"
          ok=""
          for i in $(seq 1 60); do
            live=$(curl -fsS "https://whgemachs.org/version.txt?live-check=$GITHUB_SHA-$i" 2>/dev/null | tr -d '[:space:]')
            if [ "$live" = "$GITHUB_SHA" ] && curl -fsS "https://whgemachs.org/g/wh-medical?live-check=$GITHUB_SHA" | grep -q "gemach.js?v=$want"; then ok=1; echo "Site is live"; break; fi
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error title=Site not deployed::whgemachs.org still doesn't serve this commit after 15 minutes (version.txt: ${live:-none}) — check Cloudflare Pages"; exit 1; }

          # Workers Builds results for this commit that finished before this push are from the branch it came
          # from (branch builds fail by design): ignore them and wait for the build on main.
          pushed=$(date -u -d "@$PUSHED_AT" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Waiting for the worker deploy (Workers Builds on main, after $pushed)"
          done=""
          for i in $(seq 1 60); do
            st=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
              | jq -r --arg p "$pushed" '[.check_runs[] | select(.name | startswith("Workers Builds"))
                  | select(.status != "completed" or (.completed_at // "") >= $p)]
                | if length == 0 then "none"
                  elif any(.[]; .status != "completed") then "running"
                  elif any(.[]; .conclusion == "success") then "completed:success"
                  else "completed:" + (.[0].conclusion // "") end')
            case "$st" in
              completed:success) echo "Worker deployed"; done=1; break ;;
              completed:*) echo "::error title=Worker build failed::Workers Builds on main finished as $st — the previous worker is still live"; exit 1 ;;
            esac
            sleep 15
          done
          [ -n "$done" ] || echo "::warning title=No worker build result::No Workers Builds result for main after 15 minutes; checking the site anyway"
      - name: Check the live site
        working-directory: tests
        run: node live/live-check.cjs
