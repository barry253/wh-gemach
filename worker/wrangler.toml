# Gemach Network API — deployed by Cloudflare Workers Builds from this folder on every push to main.
# Secrets (GEMACH_JWT, RESEND_API_KEY, VAPID_PRIVATE_KEY, TURNSTILE_SECRET) live only in the Cloudflare dashboard and are never touched by deploys.

name = "wh-gemach"                 # must match the Worker's name in the dashboard
main = "src/index.js"
compatibility_date = "2026-09-23"  # same as the dashboard-deployed worker; change deliberately, not casually

# Plain variables (FROM_EMAIL, ALERT_EMAIL, NOTIFY_EMAIL, ASSETS_URL, ...) stay managed in the
# dashboard: without this, every deploy would delete them.
keep_vars = true

# Where the API answers. The admin page and embeds still call the workers.dev address, so keep it on.
workers_dev = true
routes = [
  { pattern = "api.whgemachs.org", custom_domain = true },
]

# Per-visitor rate limits for the anonymous endpoints (src/abuse.js). Counted per Cloudflare location, keyed by
# the visitor's IP. Period must be 10 or 60 seconds. namespace_id is any account-unique integer.
[[ratelimits]]
name = "SUBMIT_LIMITER"       # POST /submit-request: 5 a minute per device
namespace_id = "2001"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "PUBLIC_LOG_LIMITER"   # POST /public/event and /public/search-log: 40 a minute per device
namespace_id = "2002"
  [ratelimits.simple]
  limit = 40
  period = 60

# Photo and logo storage.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "wh-gemach-assets"

# PRIVATE bucket for pickup photos (admin → Send pickup instructions → photo). Never public: the worker serves
# them at /public/pickup-photo/… for the link whgemachs.org/p/<id>, and deletes them 30 days after the items
# come back (hourly cron, src/pickupphotos.js). Not in the weekly photo backup.
[[r2_buckets]]
binding = "PICKUP_BUCKET"
bucket_name = "wh-gemach-pickup"

# Private backups bucket (nightly D1 exports, written by .github/workflows/d1-backup.yml). The worker only
# reads it: the daily cron checks the backups are still happening (src/backupwatch.js).
[[r2_buckets]]
binding = "BACKUPS_BUCKET"
bucket_name = "wh-gemach-backups"

# Daily at 14:00 UTC (10am New York in summer, 9am in winter): automatic return reminder emails (src/reminders.js)
# and the backup check (src/backupwatch.js).
# Hourly at :07: warns by email + push when today's Worker requests or D1 rows near the free daily limits
# (src/usagewatch.js; the string must match USAGE_CRON there), and deletes pickup photos whose time is up (src/pickupphotos.js).
[triggers]
crons = ["0 14 * * *", "7 * * * *"]

# Workers Logs (Observability tab).
[observability]
enabled = true

# The database (Cloudflare D1, since Oct 7, 2026; see src/db.js and src/d1.js).
# Schema: schema.sql (generated from src/dbschema.js); apply it with Actions → "D1 schema" (.github/workflows/d1.yml).
[[d1_databases]]
binding = "DB"
database_name = "wh-gemach"
database_id = "974be829-ed62-4e9a-9965-77784d5d74a5"
