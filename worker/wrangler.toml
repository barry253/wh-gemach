# Gemach Network API — deployed by Cloudflare Workers Builds from this folder on every push to main.
# Secrets (AIRTABLE_TOKEN, GEMACH_JWT, RESEND_API_KEY, VAPID_PRIVATE_KEY) live only in the Cloudflare dashboard and are never touched by deploys.

name = "wh-gemach"                 # must match the Worker's name in the dashboard
main = "src/index.js"
compatibility_date = "2026-09-23"  # same as the dashboard-deployed worker; change deliberately, not casually

# Plain variables (AIRTABLE_BASE_ID, FROM_EMAIL, ALERT_EMAIL, NOTIFY_EMAIL, ASSETS_URL, ...) stay managed in the
# dashboard: without this, every deploy would delete them.
keep_vars = true

# Where the API answers. The admin page and embeds still call the workers.dev address, so keep it on.
workers_dev = true
routes = [
  { pattern = "api.whgemachs.org", custom_domain = true },
]

# Photo and logo storage.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "wh-gemach-assets"

# Daily at 14:00 UTC (10am New York in summer, 9am in winter): automatic return reminder emails (src/reminders.js).
[triggers]
crons = ["0 14 * * *"]

# Workers Logs (Observability tab).
[observability]
enabled = true

# Which database the worker uses (src/db.js): "d1" = Cloudflare D1 (since Oct 7, 2026), "airtable" = the old
# Airtable base. Set here (not in the dashboard) so it's tracked; to switch back, change it and push, or roll
# back to the previous deployment in the dashboard. Other plain vars stay dashboard-managed (keep_vars).
[vars]
DB_BACKEND = "d1"

# Cloudflare D1 database (used when DB_BACKEND is "d1"; see src/db.js).
# Schema: schema.sql (generated from src/dbschema.js). Copy/compare: .github/workflows/d1.yml.
[[d1_databases]]
binding = "DB"
database_name = "wh-gemach"
database_id = "974be829-ed62-4e9a-9965-77784d5d74a5"
